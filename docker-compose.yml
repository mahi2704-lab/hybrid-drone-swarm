services:

  backend:
    build: .
    container_name: drone_backend
    ports:
      - "8000:8000"
    networks:
      - drone-net

  dashboard:
    build: .
    container_name: drone_dashboard
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - drone-net

networks:
  drone-net: